<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ArchVerse Widget Window Probe</title>
  <style>
    :root { color-scheme: dark; font: 14px/1.35 system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
    .card { width: 100%; height: 100%; border: 2px solid #6ce5ff; border-radius: 12px; color: #eafaff;
      background: linear-gradient(145deg, rgba(10,24,35,.96), rgba(8,13,22,.92)); box-shadow: 0 0 24px #20bddd66; }
    header { padding: 11px 14px 9px; border-bottom: 1px solid #6ce5ff55; font-weight: 750; letter-spacing: .04em; }
    header { -webkit-app-region: no-drag; user-select: none; }
    body.arrange header { cursor: move; background: #124a5d; touch-action: none; }
    main { padding: 12px 14px; }
    .badge { display: inline-block; margin-bottom: 9px; padding: 3px 8px; border-radius: 99px; background: #173b4a; color: #95efff; }
    .state { color: #9fffb0; font-weight: 700; }
    p { margin: 7px 0; }
    dl { display: grid; grid-template-columns: 86px 1fr; margin: 10px 0; gap: 4px 8px; font-size: 12px; }
    dt { color: #8ca8b5; } dd { margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    button { -webkit-app-region: no-drag; margin: 3px 4px 0 0; padding: 6px 9px; border: 1px solid #6ce5ff88;
      border-radius: 6px; color: #eafaff; background: #173b4a; }
    button:hover { background: #24617a; }
    .arrange-only { display: none; }
    body.arrange .arrange-only { display: inline-block; }
    small { display: block; margin-top: 8px; color: #96aab4; }
  </style>
</head>
<body>
  <section class="card">
    <header>ArchVerse native widget probe</header>
    <main>
      <span class="badge">Diagnostic only — no widget migrated</span>
      <p class="state" id="state">Starting in hard click-through mode…</p>
      <p>Hold <strong>F</strong> over this card, then click the test button. Press <strong>Shift+F6</strong> to arrange it.</p>
      <dl><dt>Stacking</dt><dd id="stacking">—</dd><dt>Geometry</dt><dd id="geometry">—</dd><dt>Focus</dt><dd id="focus">—</dd><dt>Clicks</dt><dd id="clicks">0</dd></dl>
      <button id="test">Test interaction</button>
      <button class="arrange-only" data-action="grow">Larger</button>
      <button class="arrange-only" data-action="shrink">Smaller</button>
      <button class="arrange-only" data-action="reset">Reset position</button>
      <button class="arrange-only" data-action="done">Done</button>
      <small>Outside this card, Star Citizen must keep receiving the mouse.</small>
    </main>
  </section>
  <script>
    const api = window.archverseWidgetPreview;
    let clicks = 0;
    const state = document.getElementById("state");
    api.onState((value) => {
      document.body.classList.toggle("arrange", value.arrangeMode === true);
      state.textContent = value.arrangeMode ? "Arrange mode — drag the header or resize" :
        value.heldInteractive ? "Held-F interaction active" : "Hard click-through active";
      document.getElementById("stacking").textContent = value.stackingOwner;
      document.getElementById("focus").textContent = value.focusPolicy;
      const b = value.bounds;
      document.getElementById("geometry").textContent = b ? `${b.x},${b.y} · ${b.width}×${b.height}` : "—";
    });
    document.getElementById("test").addEventListener("click", () => {
      document.getElementById("clicks").textContent = String(++clicks);
      api.action("clicked");
    });
    document.querySelectorAll("[data-action]").forEach((button) => button.addEventListener("click", () => api.action(button.dataset.action)));
    const header = document.querySelector("header");
    let dragPointer = null;
    header.addEventListener("pointerdown", (event) => {
      if (!document.body.classList.contains("arrange") || event.button !== 0) return;
      dragPointer = event.pointerId;
      try { header.setPointerCapture(event.pointerId); } catch {}
      api.drag("start", event.screenX, event.screenY);
      event.preventDefault();
    });
    header.addEventListener("pointermove", (event) => {
      if (event.pointerId === dragPointer) api.drag("move", event.screenX, event.screenY);
    });
    const endDrag = (event) => {
      if (event.pointerId !== dragPointer) return;
      api.drag("end", event.screenX, event.screenY);
      dragPointer = null;
    };
    header.addEventListener("pointerup", endDrag);
    header.addEventListener("pointercancel", endDrag);
    api.ready();
  </script>
</body>
</html>
