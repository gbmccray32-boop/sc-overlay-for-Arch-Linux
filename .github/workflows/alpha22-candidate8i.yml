name: Alpha22 Candidate 8i Mining Fast Path

on:
  push:
    branches: [agent/alpha22-candidate8i-mining-fast-path]
    paths-ignore:
      - docs/ARCHVERSE-CONTINUITY.md
      - ARCHVERSE-HANDOFF.generated.md
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: alpha22-candidate8i-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_VERSION: 0.1.44-r31.alpha22.candidate8i
  BASE_VERSION: 0.1.44-r31.alpha22.candidate8h
  VERIFIED_C8H_RUN_ID: '33945862290'
  VERIFIED_C8H_ARTIFACT_ID: '9963305922'
  VERIFIED_C8H_ARTIFACT: ArchVerse-0.1.44-Alpha22-Candidate8h
  VERIFIED_C8H_ARTIFACT_DIGEST: sha256:0f7b66b319729f91d9bab6eaed454b598661f9c8164a6c14dbfe95a7d539b48c
  VERIFIED_C8H_HEAD_SHA: 8c3525d58d528f877383d1088cd5eff27f5da8a3
  VERIFIED_C8H_TARBALL_SHA256: 763da3b0b460de8becda1f16f1a082824c0640326cb23760d1d55a5b2b6cfada

jobs:
  build-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Validate Candidate 8i source tools
        run: |
          set -euo pipefail
          node --check packaging/common/apply-alpha22-candidate8i.cjs
          node --check packaging/common/candidate8i-persistent-pipewire.cjs
          node --check packaging/common/candidate8i-rapidocr-client.cjs
          node --check packaging/common/candidate8i-mining-vehicle-presence.cjs
          node --check packaging/common/candidate8i-mining-fast-path-selftest.mjs

      - name: Verify pinned Candidate 8h provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          meta="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$VERIFIED_C8H_ARTIFACT_ID")"
          test "$(jq -r .name <<<"$meta")" = "$VERIFIED_C8H_ARTIFACT"
          test "$(jq -r .expired <<<"$meta")" = false
          test "$(jq -r .digest <<<"$meta")" = "$VERIFIED_C8H_ARTIFACT_DIGEST"
          test "$(jq -r .workflow_run.id <<<"$meta")" = "$VERIFIED_C8H_RUN_ID"
          test "$(jq -r .workflow_run.head_sha <<<"$meta")" = "$VERIFIED_C8H_HEAD_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_C8H_RUN_ID" --jq .head_sha)" = "$VERIFIED_C8H_HEAD_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_C8H_RUN_ID" --jq .conclusion)" = success

      - name: Download pinned Candidate 8h artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.VERIFIED_C8H_ARTIFACT }}
          path: ${{ runner.temp }}/candidate8h-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.VERIFIED_C8H_RUN_ID }}

      - name: Verify and extract exact Candidate 8h package
        run: |
          set -euo pipefail
          TARBALL="$(find "$RUNNER_TEMP/candidate8h-artifact" -type f -name "ArchVerse-Native-$BASE_VERSION.tar.gz" -print -quit)"
          test -n "$TARBALL"
          test "$(sha256sum "$TARBALL" | awk '{print $1}')" = "$VERIFIED_C8H_TARBALL_SHA256"
          mkdir -p "$RUNNER_TEMP/native"
          tar --no-same-owner -C "$RUNNER_TEMP/native" -xzf "$TARBALL"
          ROOT="$RUNNER_TEMP/native/ArchVerse-Native-$BASE_VERSION"
          test -d "$ROOT"
          jq -e --arg v "$BASE_VERSION" '.version == $v' "$ROOT/app/package.json"

      - name: Recheck Candidate 8h baseline behavior
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/native/ArchVerse-Native-$BASE_VERSION"
          node packaging/common/candidate8h-mining-liveness-selftest.mjs "$ROOT"

      - name: Apply Candidate 8i Mining fast path
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/native/ArchVerse-Native-$BASE_VERSION"
          node packaging/common/apply-alpha22-candidate8i.cjs "$ROOT"
          mv "$ROOT" "$RUNNER_TEMP/native/ArchVerse-Native-$APP_VERSION"

      - name: Assert frozen Linux and Candidate 8i contracts
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/native/ArchVerse-Native-$APP_VERSION"
          find "$ROOT/app/electron" -type f \( -name '*.cjs' -o -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
          node --check "$ROOT/app/server/server.mjs"

          grep -q 'keyboard authority=evdev' "$ROOT/app/electron/main.cjs"
          grep -q '__overlayClassifyPoint' "$ROOT/app/electron/main.cjs"
          grep -q 'function updateFHoverHit()' "$ROOT/app/electron/main.cjs"
          ! grep -q 'pointIsInsideOverlayRegion(' "$ROOT/app/electron/main.cjs"
          ! grep -q 'overlay\.setFocusable(false)' "$ROOT/app/electron/main.cjs"

          grep -q 'ARCHVERSE_LINUX_GAMESCOPE_PIPEWIRE_CAPTURE' "$ROOT/app/electron/capture.cjs"
          grep -q 'ARCHVERSE_LINUX_PIPEWIRE_REPROBE' "$ROOT/app/electron/capture.cjs"
          grep -q 'ARCHVERSE_LINUX_PIPEWIRE_RECOVERY_STATE_V2' "$ROOT/app/electron/capture.cjs"
          grep -q 'ARCHVERSE_LINUX_CAPTURE_COORDINATE_CANONICALIZATION' "$ROOT/app/electron/capture.cjs"
          grep -q 'ARCHVERSE_LINUX_MINING_COORDINATE_AUTHORITY' "$ROOT/app/electron/capture.cjs"
          grep -q 'ARCHVERSE_LINUX_MINING_SCALE_GUARD' "$ROOT/app/electron/capture.cjs"
          grep -q 'ARCHVERSE_LINUX_WINDOWS_OCR_HARD_DENY' "$ROOT/app/server/server.mjs"
          grep -q 'ARCHVERSE_LOCATION_SYNC_V3_CAPTURE' "$ROOT/app/electron/capture.cjs"
          grep -q 'ARCHVERSE_LOCATION_SYNC_DURABLE_CONSUMER' "$ROOT/app/server/server.mjs"
          ! grep -q 'Windows\.Media\.Ocr' "$ROOT/app/electron/location-sync-v3.cjs"
          ! grep -REq 'taskset|sched_setaffinity|SCHED_FIFO|SCHED_RR' "$ROOT/app/electron" "$ROOT/bin"

          grep -q 'ARCHVERSE_LINUX_GAMELOG_VEHICLE_MINING_GATE' "$ROOT/app/electron/capture.cjs"
          grep -q 'ARCHVERSE_LINUX_GAMELOG_VEHICLE_NUMERIC_GATE' "$ROOT/app/electron/capture.cjs"
          grep -q 'ARCHVERSE_LINUX_MINING_VEHICLE_RS_AUTHORITY' "$ROOT/app/electron/capture.cjs"
          grep -q 'ARCHVERSE_LINUX_GAMELOG_VEHICLE_PRESENCE' "$ROOT/app/server/server.mjs"
          grep -q 'method: "gamelog-vehicle+rs"' "$ROOT/app/electron/capture.cjs"
          grep -q 'in-vehicle + current-RS authority required' "$ROOT/app/server/server.mjs"
          grep -q 'ev.action === "grant"' "$ROOT/app/server/server.mjs"
          grep -q 'ev.action === "release"' "$ROOT/app/server/server.mjs"
          ! grep -q 'await archVerseScanMode(shot' "$ROOT/app/electron/capture.cjs"
          ! grep -q 'method: "pipewire-radar+rs"' "$ROOT/app/electron/capture.cjs"

          grep -q 'ARCHVERSE_LINUX_MINING_RS_CATALOG_V2' "$ROOT/app/electron/mining-signature-catalog.cjs"
          grep -q 'const DEBRIS_BASE = 2000;' "$ROOT/app/electron/mining-signature-catalog.cjs"
          grep -q 'ARCHVERSE_LINUX_MINING_INLINE_COMMIT' "$ROOT/app/electron/capture.cjs"
          grep -q 'ARCHVERSE_LINUX_MINING_INLINE_COMMIT_SERVER' "$ROOT/app/server/server.mjs"
          ! grep -q 'radar+RS CONFIRMED' "$ROOT/app/server/server.mjs"

          grep -q 'ARCHVERSE_LINUX_GAMESCOPE_PIPEWIRE_PERSISTENT_STREAM' "$ROOT/app/electron/capture.cjs"
          grep -q 'ARCHVERSE_LINUX_GAMESCOPE_PIPEWIRE_PERSISTENT_STREAM' "$ROOT/app/electron/persistent-gamescope-pipewire.cjs"
          grep -q 'ARCHVERSE_LINUX_MINING_OCR_PRIORITY_LANES' "$ROOT/app/electron/capture.cjs"
          grep -q 'ARCHVERSE_LINUX_MINING_EXCLUSIVE_OCR' "$ROOT/app/electron/capture.cjs"
          grep -q 'ARCHVERSE_LINUX_MINING_LATEST_FRAME_SCHEDULER' "$ROOT/app/electron/capture.cjs"
          grep -q 'ARCHVERSE_LINUX_MINING_VEHICLE_PRESENCE_STREAM' "$ROOT/app/electron/mining-vehicle-presence.cjs"
          grep -q 'ARCHVERSE_LINUX_MINING_OCR_RECOVERY' "$ROOT/app/electron/rapidocr-client.cjs"
          grep -q 'ARCHVERSE_LINUX_MINING_TESSERACT_BOUNDED_FALLBACK' "$ROOT/app/electron/native-linux-ocr.cjs"
          grep -q 'ARCHVERSE_LINUX_MINING_CONTEXT_SAFE_RS_ADMISSION' "$ROOT/app/server/server.mjs"
          grep -q '/api/vehicle-presence/events' "$ROOT/app/server/server.mjs"
          grep -q 'timeoutMs: 900, restartOnFailure: true' "$ROOT/app/electron/capture.cjs"
          grep -q 'tesseractTimeoutMs: 600' "$ROOT/app/electron/capture.cjs"
          grep -q 'multifilesink' "$ROOT/app/electron/persistent-gamescope-pipewire.cjs"
          grep -q 'leaky=downstream' "$ROOT/app/electron/persistent-gamescope-pipewire.cjs"
          ! grep -q 'num-buffers=1' "$ROOT/app/electron/persistent-gamescope-pipewire.cjs"
          ! grep -q 'setInterval(tick, rate)' "$ROOT/app/electron/capture.cjs"
          jq -e --arg v "$APP_VERSION" '.version == $v' "$ROOT/app/package.json"

      - name: Exercise Mining fast path and false-context rejection
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/native/ArchVerse-Native-$APP_VERSION"
          node packaging/common/candidate8i-mining-fast-path-selftest.mjs "$ROOT"

      - name: Package Candidate 8i
        run: |
          set -euo pipefail
          mkdir -p dist
          tar --owner=0 --group=0 -C "$RUNNER_TEMP/native" -czf "dist/ArchVerse-Native-$APP_VERSION.tar.gz" "ArchVerse-Native-$APP_VERSION"
          (cd dist && sha256sum "ArchVerse-Native-$APP_VERSION.tar.gz" > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: ArchVerse-0.1.44-Alpha22-Candidate8i
          path: |
            dist/ArchVerse-Native-${{ env.APP_VERSION }}.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
