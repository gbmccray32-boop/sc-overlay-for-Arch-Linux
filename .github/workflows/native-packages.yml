name: Build Native Linux Packages

on:
  push:
    branches:
      - integration/native-packages-r31-alpha21
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-packages-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_VERSION: 0.1.42-r31-alpha.21
  ALPHA20_ASSET: ArchVerse-Overlay-0.1.42-r31-alpha.20-arch.tar.gz
  ALPHA20_SHA256: f4256aeac8c13fb0a64fc6065a8869bf58015dbe694200a550aaf9e99e3dd0a6
  ELECTRON_ASSET: electron-v42.7.1-linux-x64.zip
  ELECTRON_SHA256: e85b28245deaa75c3c4f2cf5da084f4c7fbedd5af1630c59a827c41ac1f5e1af

jobs:
  stage:
    name: Shared native Alpha21 payload
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify native baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sources"
          gh release download v0.1.42-r31-alpha.20 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$ALPHA20_ASSET" \
            --dir "$RUNNER_TEMP/sources"
          echo "$ALPHA20_SHA256  $RUNNER_TEMP/sources/$ALPHA20_ASSET" | sha256sum -c -

      - name: Download and verify pinned Electron
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 \
            "https://github.com/electron/electron/releases/download/v42.7.1/$ELECTRON_ASSET" \
            --output "$RUNNER_TEMP/sources/$ELECTRON_ASSET"
          echo "$ELECTRON_SHA256  $RUNNER_TEMP/sources/$ELECTRON_ASSET" | sha256sum -c -

      - name: Build and verify shared native payload
        run: |
          set -euo pipefail
          STAGE_ROOT="$RUNNER_TEMP/native/ArchVerse-Native-$APP_VERSION"
          bash packaging/native/stage-alpha21.sh \
            "$RUNNER_TEMP/sources/$ALPHA20_ASSET" \
            "$RUNNER_TEMP/sources/$ELECTRON_ASSET" \
            "$STAGE_ROOT"

          test -x "$STAGE_ROOT/runtime/electron/electron"
          grep -q 'ARCHVERSE_LINUX_HOVER_SCOPED_LATCH' "$STAGE_ROOT/app/electron/main.cjs"
          grep -q 'SC_TRACKER_RENDER_MODE' "$STAGE_ROOT/bin/sc-blueprint-tracker"
          grep -q -- '--ozone-platform=x11' "$STAGE_ROOT/bin/sc-blueprint-tracker"
          grep -q 'SC_TRACKER_HOST_WAYLAND_DISPLAY' "$STAGE_ROOT/bin/sc-blueprint-tracker"

          mkdir -p dist
          tar -C "$RUNNER_TEMP/native" -czf "dist/ArchVerse-Native-$APP_VERSION.tar.gz" \
            "ArchVerse-Native-$APP_VERSION"
          sha256sum "dist/ArchVerse-Native-$APP_VERSION.tar.gz" | tee dist/NATIVE-PAYLOAD-SHA256

      - name: Inspect bundled native ABI requirements
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/native/ArchVerse-Native-$APP_VERSION"
          echo '--- Electron GLIBC requirements ---'
          strings "$ROOT/runtime/electron/electron" | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tail -20 || true
          echo '--- uiohook GLIBC requirements ---'
          strings "$ROOT/app/node_modules/uiohook-napi/prebuilds/linux-x64/uiohook-napi.node" | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tail -20 || true
          echo '--- ONNX binding GLIBC requirements ---'
          strings "$ROOT/app/node_modules/onnxruntime-node/bin/napi-v6/linux/x64/onnxruntime_binding.node" | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tail -20 || true

      - name: Upload shared native payload
        uses: actions/upload-artifact@v4
        with:
          name: ArchVerse-Native-Alpha21-Shared
          path: |
            dist/ArchVerse-Native-${{ env.APP_VERSION }}.tar.gz
            dist/NATIVE-PAYLOAD-SHA256
          if-no-files-found: error
          compression-level: 0

  arch:
    name: Arch / CachyOS package
    needs: stage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ArchVerse-Native-Alpha21-Shared
          path: dist/shared

      - name: Build PKGBUILD in clean Arch container
        run: |
          set -euo pipefail
          cp "dist/shared/ArchVerse-Native-$APP_VERSION.tar.gz" packaging/arch/
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            archlinux:latest \
            bash -lc '
              set -euo pipefail
              pacman -Syu --noconfirm --needed base-devel
              useradd -m builder
              chown -R builder:builder /work/packaging/arch
              runuser -u builder -- bash -lc "cd /work/packaging/arch && makepkg --nodeps --noconfirm --cleanbuild"
              pkg=$(find /work/packaging/arch -maxdepth 1 -name "archverse-overlay-*.pkg.tar.zst" -print -quit)
              test -n "$pkg"
              pacman -Qp "$pkg"
              bsdtar -tvf "$pkg" | grep "opt/archverse-overlay/runtime/electron/chrome-sandbox"
              bsdtar -tf "$pkg" | grep -q "usr/bin/archverse-overlay"
              chmod -R a+rX /work/packaging/arch
            '
          mkdir -p dist/arch
          cp packaging/arch/archverse-overlay-*.pkg.tar.zst dist/arch/
          sha256sum dist/arch/*.pkg.tar.zst

      - name: Upload Arch package
        uses: actions/upload-artifact@v4
        with:
          name: ArchVerse-Alpha21-Arch-CachyOS
          path: dist/arch/*.pkg.tar.zst
          if-no-files-found: error
          compression-level: 0

  fedora:
    name: Fedora 43 / Nobara package
    needs: stage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ArchVerse-Native-Alpha21-Shared
          path: dist/shared

      - name: Build RPM in Fedora 43 container
        run: |
          set -euo pipefail
          rm -rf rpmbuild
          mkdir -p rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          cp "dist/shared/ArchVerse-Native-$APP_VERSION.tar.gz" rpmbuild/SOURCES/
          cp packaging/native/archverse-overlay.desktop rpmbuild/SOURCES/
          cp packaging/fedora/archverse-overlay.spec rpmbuild/SPECS/

          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            fedora:43 \
            bash -lc '
              set -euo pipefail
              dnf -y install rpm-build rpmdevtools tar gzip findutils
              rpmbuild -bb --define "_topdir /work/rpmbuild" /work/rpmbuild/SPECS/archverse-overlay.spec
              rpmfile=$(find /work/rpmbuild/RPMS -name "archverse-overlay-*.rpm" -print -quit)
              test -n "$rpmfile"
              rpm -qpi "$rpmfile"
              echo "--- generated RPM requirements ---"
              rpm -qpR "$rpmfile" | sort
              echo "--- chrome-sandbox package mode ---"
              rpm -qplv "$rpmfile" | grep "runtime/electron/chrome-sandbox"
              rpm -qpl "$rpmfile" | grep -q "/usr/bin/archverse-overlay"
              chmod -R a+rX /work/rpmbuild
            '

          mkdir -p dist/fedora
          find rpmbuild/RPMS -name 'archverse-overlay-*.rpm' -exec cp {} dist/fedora/ \;
          sha256sum dist/fedora/*.rpm

      - name: Upload Fedora/Nobara RPM
        uses: actions/upload-artifact@v4
        with:
          name: ArchVerse-Alpha21-Fedora43-Nobara
          path: dist/fedora/*.rpm
          if-no-files-found: error
          compression-level: 0

  debian:
    name: Debian / Ubuntu package
    needs: stage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ArchVerse-Native-Alpha21-Shared
          path: dist/shared

      - name: Build DEB
        run: |
          set -euo pipefail
          mkdir -p dist/debian
          bash packaging/debian/build-deb.sh \
            "dist/shared/ArchVerse-Native-$APP_VERSION.tar.gz" \
            dist/debian
          deb=$(find dist/debian -name 'archverse-overlay_*_amd64.deb' -print -quit)
          test -n "$deb"
          dpkg-deb -f "$deb" Package Version Architecture Depends
          dpkg-deb -c "$deb" | grep 'runtime/electron/chrome-sandbox'
          dpkg-deb -c "$deb" | grep -q 'usr/bin/archverse-overlay'
          sha256sum "$deb"

      - name: Upload Debian/Ubuntu DEB
        uses: actions/upload-artifact@v4
        with:
          name: ArchVerse-Alpha21-Debian-Ubuntu
          path: dist/debian/*.deb
          if-no-files-found: error
          compression-level: 0

  checksums:
    name: Combined native package checksums
    needs: [arch, fedora, debian]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ArchVerse-Alpha21-Arch-CachyOS
          path: dist/incoming/arch
      - uses: actions/download-artifact@v4
        with:
          name: ArchVerse-Alpha21-Fedora43-Nobara
          path: dist/incoming/fedora
      - uses: actions/download-artifact@v4
        with:
          name: ArchVerse-Alpha21-Debian-Ubuntu
          path: dist/incoming/debian

      - name: Assemble package set
        run: |
          set -euo pipefail
          mkdir -p dist/final
          find dist/incoming -type f \( -name '*.pkg.tar.zst' -o -name '*.rpm' -o -name '*.deb' \) -exec cp {} dist/final/ \;
          test "$(find dist/final -type f | wc -l)" -eq 3
          (
            cd dist/final
            sha256sum * > SHA256SUMS
            cat SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Upload complete native test set
        uses: actions/upload-artifact@v4
        with:
          name: ArchVerse-Alpha21-Native-Test-Set
          path: dist/final/
          if-no-files-found: error
          compression-level: 0
