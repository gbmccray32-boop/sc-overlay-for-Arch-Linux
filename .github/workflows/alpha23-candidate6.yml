name: Alpha23 Candidate 6 Normal Capture Confirmation
on:
  push:
    branches: [agent/alpha23-candidate6-normal-capture-confirmation]
    paths-ignore:
      - docs/ARCHVERSE-CONTINUITY.md
      - ARCHVERSE-HANDOFF.generated.md
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: alpha23-candidate6-${{ github.ref }}
  cancel-in-progress: true
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify upstream v0.1.47 source gates
        run: |
          set -euo pipefail
          npm run typecheck
          npm run test:reppage
          npm run test:repscan
          npm run control:repname
      - uses: actions/download-artifact@v4
        with:
          name: ArchVerse-Alpha23-Candidate5-field-test
          path: candidate5-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34712283860
      - name: Verify Candidate 5 and stage Candidate 6
        run: |
          set -euo pipefail
          archive=candidate5-artifact/ArchVerse-Native-0.1.47-r31.alpha23.candidate5.tar.gz
          test "$(sha256sum "$archive" | cut -d ' ' -f1)" = aa14e095aae1b864cd6f18c72837db800c7955802cdfd1a1d6266743d8b5c380
          mkdir candidate5
          tar --no-same-owner -xzf "$archive" -C candidate5
          baseline="$(realpath candidate5/ArchVerse-Native-0.1.47-r31.alpha23.candidate5)"
          node packaging/common/alpha23-candidate5-selftest.mjs "$baseline"
          node packaging/common/alpha23-candidate5-sidecar-selftest.mjs "$baseline"
          node packaging/common/stage-alpha23-candidate6.mjs "$baseline" "$RUNNER_TEMP/field/ArchVerse-Native-0.1.47-r31.alpha23.candidate6"
      - name: Run packaged gates
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/field/ArchVerse-Native-0.1.47-r31.alpha23.candidate6"
          find "$candidate/app/electron" -type f \( -name '*.cjs' -o -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
          node --check "$candidate/app/server/server.mjs"
          python3 packaging/common/alpha23-renderer-audit.py "$candidate"
          node packaging/common/alpha23-linux-bridge-selftest.cjs "$candidate"
          node packaging/common/alpha23-main-startup-selftest.cjs "$candidate/app/electron/main.cjs"
          node "$candidate/tests/alpha23-candidate6-normal-capture.test.cjs"
          node tools/archverse-config-e2e.mjs "$candidate/app/server"
          mkdir -p node_modules/electron/dist
          printf '#!/bin/sh\nexec "%s" --no-sandbox "$@"\n' \
            "$candidate/runtime/electron/electron" > node_modules/electron/dist/electron.exe
          chmod +x node_modules/electron/dist/electron.exe
          xvfb-run -a npm run control:ageband
      - name: Run staged widget integration
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/field/ArchVerse-Native-0.1.47-r31.alpha23.candidate6"
          mkdir -p "$RUNNER_TEMP/alpha23-widget-config"
          printf '%s\n' '{"syncEnabled":false,"shareLogs":false,"setupComplete":true}' > "$RUNNER_TEMP/alpha23-widget-config/config.json"
          SC_TRACKER_CONFIG_DIR="$RUNNER_TEMP/alpha23-widget-config" PORT=18778 node "$candidate/app/server/server.mjs" > "$RUNNER_TEMP/alpha23-widget-server.log" 2>&1 &
          sidecar=$!
          trap 'kill "$sidecar" 2>/dev/null || true' EXIT
          for _ in {1..30}; do curl --fail --silent http://127.0.0.1:18778/missions.html >/dev/null && break; sleep 1; done
          curl --fail --silent http://127.0.0.1:18778/missions.html >/dev/null
          OVERLAY_PORT=18778 xvfb-run -a "$candidate/runtime/electron/electron" --no-sandbox tools/widget-dom-test.cjs --pairs
      - name: Package quarantined field candidate
        run: |
          set -euo pipefail
          name=ArchVerse-Native-0.1.47-r31.alpha23.candidate6
          root="$RUNNER_TEMP/field/$name"
          mkdir -p field-artifact
          cp "$root/FIELD-TEST.md" "$root/README.md"
          (cd "$root" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS && sha256sum -c SHA256SUMS >/dev/null)
          tar -czf "field-artifact/$name.tar.gz" -C "$RUNNER_TEMP/field" "$name"
          (cd field-artifact && sha256sum "$name.tar.gz" > SHA256SUMS)
          cp "$root/FIELD-TEST.md" field-artifact/
      - uses: actions/upload-artifact@v4
        with:
          name: ArchVerse-Alpha23-Candidate6-field-test
          path: field-artifact/
          if-no-files-found: error
          retention-days: 90
