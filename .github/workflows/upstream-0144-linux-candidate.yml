name: Upstream 0.1.44+ Linux Candidate

on:
  push:
    branches:
      - agent/upstream-0.1.44-linux-port
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-0144-linux-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_VERSION: 0.1.44-r31.alpha22.candidate1
  ALPHA20_ASSET: ArchVerse-Overlay-0.1.42-r31-alpha.20-arch.tar.gz
  ALPHA20_SHA256: f4256aeac8c13fb0a64fc6065a8869bf58015dbe694200a550aaf9e99e3dd0a6
  ELECTRON_ASSET: electron-v42.7.1-linux-x64.zip
  ELECTRON_SHA256: e85b28245deaa75c3c4f2cf5da084f4c7fbedd5af1630c59a827c41ac1f5e1af

jobs:
  upstream-logic:
    name: Upstream logic + Linux semantic build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Typecheck current upstream logic
        run: npm run typecheck

      - name: Run high-risk upstream regression suites
        run: |
          set -euo pipefail
          npm run test:localization
          npm run test:handover
          npm run test:contracts
          npm run test:hauling
          npm run test:solver
          npm run test:haulplan
          npm run test:advisor
          npm run test:clienterror
          npm run test:location

      - name: Build current upstream sidecar with Linux semantic contracts
        run: |
          set -euo pipefail
          npm run build:server
          node --check build/server/server.mjs
          grep -q 'SC_TRACKER_CONFIG_DIR' build/server/server.mjs
          grep -q 'Shift+F6' build/server/server.mjs
          grep -q 'ArchVerse Linux RapidOCR (Electron capture)' build/server/server.mjs
          grep -q 'logbackups' build/server/server.mjs
          grep -q 'startPosition' build/server/server.mjs
          grep -q 'ARCHVERSE_LINUX_SETTINGS_CONTRACT' build/server/overlay/config.html
          grep -q 'ARCHVERSE_LINUX_DYNAMIC_WIDGET_REGIONS' build/server/overlay/missions.html
          grep -q 'ARCHVERSE_RESOURCE_SCANNER_V1' build/server/overlay/mining.html
          test -s build/server/overlay/hauling.html
          test -s build/server/overlay/hauling-stow.js

      - name: Upload validated sidecar
        uses: actions/upload-artifact@v4
        with:
          name: upstream-0144-linux-sidecar
          path: build/server/
          if-no-files-found: error
          compression-level: 0

  linux-runtime:
    name: Reconstruct verified Linux runtime + transplant behavior
    needs: upstream-logic
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/download-artifact@v4
        with:
          name: upstream-0144-linux-sidecar
          path: build/server

      - name: Download and verify verified Alpha20 baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sources"
          gh release download v0.1.42-r31-alpha.20 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$ALPHA20_ASSET" \
            --dir "$RUNNER_TEMP/sources"
          echo "$ALPHA20_SHA256  $RUNNER_TEMP/sources/$ALPHA20_ASSET" | sha256sum -c -

      - name: Download and verify pinned Electron
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 \
            "https://github.com/electron/electron/releases/download/v42.7.1/$ELECTRON_ASSET" \
            --output "$RUNNER_TEMP/sources/$ELECTRON_ASSET"
          echo "$ELECTRON_SHA256  $RUNNER_TEMP/sources/$ELECTRON_ASSET" | sha256sum -c -

      - name: Stage quarantined 0.1.44+ Linux candidate
        run: |
          set -euo pipefail
          STAGE_ROOT="$RUNNER_TEMP/native/ArchVerse-Native-$APP_VERSION"
          bash packaging/native/stage-upstream-0144-candidate.sh \
            "$RUNNER_TEMP/sources/$ALPHA20_ASSET" \
            "$RUNNER_TEMP/sources/$ELECTRON_ASSET" \
            "$STAGE_ROOT"

          test -x "$STAGE_ROOT/runtime/electron/electron"
          grep -q -- '--ozone-platform=x11' "$STAGE_ROOT/bin/sc-blueprint-tracker"
          grep -q 'SC_TRACKER_HOST_WAYLAND_DISPLAY' "$STAGE_ROOT/bin/sc-blueprint-tracker"
          grep -q 'ARCHVERSE_LINUX_HOVER_SCOPED_LATCH' "$STAGE_ROOT/app/electron/main.cjs"
          ! grep -q 'overlay\.setFocusable(false)' "$STAGE_ROOT/app/electron/main.cjs"

          mkdir -p dist
          tar -C "$RUNNER_TEMP/native" -czf "dist/ArchVerse-Native-$APP_VERSION.tar.gz" \
            "ArchVerse-Native-$APP_VERSION"
          sha256sum "dist/ArchVerse-Native-$APP_VERSION.tar.gz" | tee dist/SHA256SUMS

      - name: Upload quarantined native candidate
        uses: actions/upload-artifact@v4
        with:
          name: ArchVerse-0.1.44-Alpha22-Linux-Candidate
          path: |
            dist/ArchVerse-Native-${{ env.APP_VERSION }}.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
