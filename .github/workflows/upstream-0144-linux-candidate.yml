name: Upstream 0.1.44+ Linux Candidate

on:
  push:
    branches:
      - agent/upstream-0.1.44-linux-port
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: upstream-0144-linux-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_VERSION: 0.1.44-r31.alpha22.candidate1
  VERIFIED_ALPHA21_RUN_ID: '31901404904'
  VERIFIED_ALPHA21_ARTIFACT_ID: '9251185299'
  VERIFIED_ALPHA21_ARTIFACT: ArchVerse-Alpha21-native-payload
  VERIFIED_ALPHA21_ARTIFACT_DIGEST: sha256:6a6e05eeb8f7a91e06d5a60fb1b93230a3d6564c66741a71642926191815bbca
  VERIFIED_ALPHA21_HEAD_SHA: 9f3c095b74c5220b7720717c5bb8d6ed2bc28382
  VERIFIED_ALPHA21_PAYLOAD: ArchVerse-Overlay-0.1.42-r31-alpha.21-payload.tar.gz
  ELECTRON_ASSET: electron-v42.7.1-linux-x64.zip
  ELECTRON_SHA256: e85b28245deaa75c3c4f2cf5da084f4c7fbedd5af1630c59a827c41ac1f5e1af

jobs:
  upstream-logic:
    name: Upstream logic + Linux semantic build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Typecheck current upstream logic
        run: npm run typecheck

      - name: Run high-risk upstream regression suites
        run: |
          set -euo pipefail
          npm run test:localization
          npm run test:handover
          npm run test:contracts
          npm run test:hauling
          npm run test:solver
          npm run test:haulplan
          npm run test:advisor
          npm run test:mining
          npm run test:screenocr
          npm run test:clienterror
          npm run test:location

      - name: Exercise widget DOM and hotkey surfaces under Xvfb
        run: |
          set -euo pipefail
          node --check tools/widget-dom-test.cjs
          xvfb-run -a ./node_modules/.bin/electron --no-sandbox tools/widget-dom-test.cjs

      - name: Build current upstream sidecar with Linux semantic contracts
        run: |
          set -euo pipefail
          npm run build:server
          node --check build/server/server.mjs
          node --check build/server/overlay/linux-ocr-region-manager.js
          grep -q 'SC_TRACKER_CONFIG_DIR' build/server/server.mjs
          grep -q 'Shift+F6' build/server/server.mjs
          grep -q 'ArchVerse Linux RapidOCR (Electron capture)' build/server/server.mjs
          grep -q 'ARCHVERSE_LINUX_NO_WINDOWS_MEDIA_OCR' build/server/server.mjs
          grep -q 'ARCHVERSE_LINUX_OCR_REGION_CONFIG' build/server/server.mjs
          grep -q 'linuxOcrRegions' build/server/server.mjs
          grep -q 'logbackups' build/server/server.mjs
          grep -q 'startPosition' build/server/server.mjs
          grep -q 'ARCHVERSE_LINUX_SETTINGS_CONTRACT' build/server/overlay/config.html
          grep -q 'ARCHVERSE_LINUX_DYNAMIC_WIDGET_REGIONS' build/server/overlay/missions.html
          grep -q 'ARCHVERSE_LINUX_PER_WIDGET_OCR_REGION_UI_LOADER' build/server/overlay/missions.html
          grep -q '.ocr-capture-box.shown, body.scanbox #scanBox' build/server/overlay/missions.html
          grep -q 'ARCHVERSE_LINUX_PER_WIDGET_OCR_REGION_UI' build/server/overlay/linux-ocr-region-manager.js
          grep -q 'ARCHVERSE_RESOURCE_SCANNER_V1' build/server/overlay/mining.html
          grep -q 'WIDGET_HOTKEYS' build/server/overlay/config.html
          grep -q '"hauling"' build/server/overlay/config.html
          test -s build/server/overlay/hauling.html
          test -s build/server/overlay/hauling-stow.js

      - name: Upload validated sidecar
        uses: actions/upload-artifact@v4
        with:
          name: upstream-0144-linux-sidecar
          path: build/server/
          if-no-files-found: error
          compression-level: 0

  linux-runtime:
    name: Verified Alpha21 runtime + current upstream behavior
    needs: upstream-logic
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/download-artifact@v4
        with:
          name: upstream-0144-linux-sidecar
          path: build/server

      - name: Verify pinned Alpha21 payload provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          meta="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$VERIFIED_ALPHA21_ARTIFACT_ID")"
          test "$(jq -r .name <<<"$meta")" = "$VERIFIED_ALPHA21_ARTIFACT"
          test "$(jq -r .expired <<<"$meta")" = "false"
          test "$(jq -r .digest <<<"$meta")" = "$VERIFIED_ALPHA21_ARTIFACT_DIGEST"
          test "$(jq -r .workflow_run.id <<<"$meta")" = "$VERIFIED_ALPHA21_RUN_ID"
          run_head="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_ALPHA21_RUN_ID" --jq .head_sha)"
          test "$run_head" = "$VERIFIED_ALPHA21_HEAD_SHA"
          echo "Verified Alpha21 payload artifact $VERIFIED_ALPHA21_ARTIFACT_ID from run $VERIFIED_ALPHA21_RUN_ID"

      - name: Download verified Alpha21 payload from successful August 15 run
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.VERIFIED_ALPHA21_ARTIFACT }}
          path: ${{ runner.temp }}/verified-alpha21
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.VERIFIED_ALPHA21_RUN_ID }}

      - name: Validate verified Alpha21 payload archive
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/verified-alpha21/$VERIFIED_ALPHA21_PAYLOAD"
          tar -tzf "$RUNNER_TEMP/verified-alpha21/$VERIFIED_ALPHA21_PAYLOAD" > "$RUNNER_TEMP/alpha21-files.txt"
          grep -q 'ArchVerse-Overlay-0.1.42-r31-alpha.21/app/electron/main.cjs' "$RUNNER_TEMP/alpha21-files.txt"
          grep -q 'ArchVerse-Overlay-0.1.42-r31-alpha.21/app/electron/native-linux-ocr.cjs' "$RUNNER_TEMP/alpha21-files.txt"
          grep -q 'ArchVerse-Overlay-0.1.42-r31-alpha.21/app/server/overlay/linux-ocr-region-manager.js' "$RUNNER_TEMP/alpha21-files.txt"

      - name: Download and verify pinned Electron
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sources"
          curl --fail --location --retry 4 \
            "https://github.com/electron/electron/releases/download/v42.7.1/$ELECTRON_ASSET" \
            --output "$RUNNER_TEMP/sources/$ELECTRON_ASSET"
          echo "$ELECTRON_SHA256  $RUNNER_TEMP/sources/$ELECTRON_ASSET" | sha256sum -c -

      - name: Stage quarantined 0.1.44+ Linux candidate
        run: |
          set -euo pipefail
          STAGE_ROOT="$RUNNER_TEMP/native/ArchVerse-Native-$APP_VERSION"
          bash packaging/native/stage-upstream-0144-candidate.sh \
            "$RUNNER_TEMP/verified-alpha21/$VERIFIED_ALPHA21_PAYLOAD" \
            "$RUNNER_TEMP/sources/$ELECTRON_ASSET" \
            "$STAGE_ROOT"

          test -x "$STAGE_ROOT/runtime/electron/electron"
          grep -q -- '--ozone-platform=x11' "$STAGE_ROOT/bin/sc-blueprint-tracker"
          grep -q 'SC_TRACKER_HOST_WAYLAND_DISPLAY' "$STAGE_ROOT/bin/sc-blueprint-tracker"
          grep -q 'ARCHVERSE_LINUX_HOVER_SCOPED_LATCH' "$STAGE_ROOT/app/electron/main.cjs"
          grep -q 'ARCHVERSE_LINUX_GAME_FOCUS_HANDOFF' "$STAGE_ROOT/app/electron/main.cjs"
          grep -q 'ARCHVERSE_LINUX_DRAG_LOCK_WATCHDOG' "$STAGE_ROOT/app/electron/main.cjs"
          grep -q 'ARCHVERSE_UPSTREAM_0144_HAULING' "$STAGE_ROOT/app/electron/main.cjs"
          grep -q 'ARCHVERSE_UPSTREAM_0144_WIDGET_HOTKEYS' "$STAGE_ROOT/app/electron/main.cjs"
          grep -q 'ARCHVERSE_UPSTREAM_0144_FOCUS_BEHAVIOR' "$STAGE_ROOT/app/electron/main.cjs"
          ! grep -q 'overlay\.setFocusable(false)' "$STAGE_ROOT/app/electron/main.cjs"
          grep -qi 'gamescope' "$STAGE_ROOT/app/electron/capture.cjs"
          grep -qi 'pipewire' "$STAGE_ROOT/app/electron/capture.cjs"
          grep -qi 'rapidocr' "$STAGE_ROOT/app/electron/capture.cjs"
          grep -q 'linuxOcrRegions' "$STAGE_ROOT/app/server/server.mjs"
          grep -q 'logbackups' "$STAGE_ROOT/app/server/server.mjs"

          mkdir -p dist
          tar -C "$RUNNER_TEMP/native" -czf "dist/ArchVerse-Native-$APP_VERSION.tar.gz" \
            "ArchVerse-Native-$APP_VERSION"
          sha256sum "dist/ArchVerse-Native-$APP_VERSION.tar.gz" | tee dist/SHA256SUMS

      - name: Upload quarantined native candidate
        uses: actions/upload-artifact@v4
        with:
          name: ArchVerse-0.1.44-Alpha22-Linux-Candidate
          path: |
            dist/ArchVerse-Native-${{ env.APP_VERSION }}.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
