name: Alpha22 Candidate 7b Durable Location Sync

on:
  push:
    branches:
      - agent/alpha22-candidate7b-durable-location-handoff
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: alpha22-candidate7b-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_VERSION: 0.1.44-r31.alpha22.candidate7b
  BASE_STAGE_VERSION: 0.1.44-r31.alpha22.candidate6
  VERIFIED_ALPHA21_CORE_RUN_ID: '31901404904'
  VERIFIED_ALPHA21_CORE_ARTIFACT_ID: '9251185299'
  VERIFIED_ALPHA21_CORE_ARTIFACT: ArchVerse-Alpha21-native-payload
  VERIFIED_ALPHA21_CORE_DIGEST: sha256:6a6e05eeb8f7a91e06d5a60fb1b93230a3d6564c66741a71642926191815bbca
  VERIFIED_ALPHA21_CORE_HEAD_SHA: 9f3c095b74c5220b7720717c5bb8d6ed2bc28382
  VERIFIED_ALPHA21_CORE_PAYLOAD: ArchVerse-Overlay-0.1.42-r31-alpha.21-payload.tar.gz
  ELECTRON_ASSET: electron-v42.7.1-linux-x64.zip
  ELECTRON_SHA256: e85b28245deaa75c3c4f2cf5da084f4c7fbedd5af1630c59a827c41ac1f5e1af

jobs:
  build-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install and validate source
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm run test:mining
          npm run test:screenocr
          npm run test:hauling
          npm run test:location
          npm run build:server
          node --check build/server/server.mjs
          node --check packaging/common/enforce-location-sync-v3.cjs
          node --check packaging/common/enforce-location-sync-v3b.cjs
          node --check packaging/common/location-sync-v3.cjs
          node tests/location-sync-v3.test.cjs

      - name: Verify pinned Alpha21 core provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          meta="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$VERIFIED_ALPHA21_CORE_ARTIFACT_ID")"
          test "$(jq -r .name <<<"$meta")" = "$VERIFIED_ALPHA21_CORE_ARTIFACT"
          test "$(jq -r .expired <<<"$meta")" = "false"
          test "$(jq -r .digest <<<"$meta")" = "$VERIFIED_ALPHA21_CORE_DIGEST"
          test "$(jq -r .workflow_run.id <<<"$meta")" = "$VERIFIED_ALPHA21_CORE_RUN_ID"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_ALPHA21_CORE_RUN_ID" --jq .head_sha)" = "$VERIFIED_ALPHA21_CORE_HEAD_SHA"

      - name: Download pinned Alpha21 core
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.VERIFIED_ALPHA21_CORE_ARTIFACT }}
          path: ${{ runner.temp }}/verified-alpha21-core
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.VERIFIED_ALPHA21_CORE_RUN_ID }}

      - name: Download pinned Electron
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sources"
          curl --fail --location --retry 4 \
            "https://github.com/electron/electron/releases/download/v42.7.1/$ELECTRON_ASSET" \
            --output "$RUNNER_TEMP/sources/$ELECTRON_ASSET"
          echo "$ELECTRON_SHA256  $RUNNER_TEMP/sources/$ELECTRON_ASSET" | sha256sum -c -

      - name: Reconstruct Candidate 7b in semantic order
        run: |
          set -euo pipefail
          WORK_ROOT="$RUNNER_TEMP/native/ArchVerse-Native-$BASE_STAGE_VERSION"
          FINAL_ROOT="$RUNNER_TEMP/native/ArchVerse-Native-$APP_VERSION"

          bash packaging/native/stage-upstream-0144-candidate.sh \
            "$RUNNER_TEMP/verified-alpha21-core/$VERIFIED_ALPHA21_CORE_PAYLOAD" \
            "$RUNNER_TEMP/sources/$ELECTRON_ASSET" \
            "$WORK_ROOT"
          node packaging/common/enforce-native-linux-pipewire-capture.cjs "$WORK_ROOT"
          node packaging/common/enforce-alpha22-performance-repair.cjs "$WORK_ROOT"
          node packaging/common/enforce-alpha22-field-fixes.cjs "$WORK_ROOT"
          node packaging/common/enforce-alpha22-first-f.cjs "$WORK_ROOT"
          node packaging/common/enforce-alpha22-scan-lane-stall-fixes.cjs "$WORK_ROOT"

          # The generic stage helper deliberately retains its internal candidate1 package label.
          # Promote that exact staged runtime to the already-field-tested Candidate 6 identity before
          # the Candidate 7 fail-closed patch is allowed to touch it.
          python3 - "$WORK_ROOT/app/package.json" "$BASE_STAGE_VERSION" <<'PY'
          import json, sys
          from pathlib import Path
          p=Path(sys.argv[1]); d=json.loads(p.read_text()); d['version']=sys.argv[2]
          d['description']='ArchVerse Alpha22 Candidate 6: first-F field-pass, Scan Mode authority ROI, nonblocking auxiliary OCR'
          p.write_text(json.dumps(d, indent=2)+'\n')
          PY

          node packaging/common/enforce-location-sync-v3.cjs "$WORK_ROOT"
          node packaging/common/enforce-location-sync-v3b.cjs "$WORK_ROOT"

          install -m 0644 packaging/diagnostics/location-sync-diagnostic.cjs \
            "$WORK_ROOT/app/electron/location-sync-diagnostic.cjs"
          install -m 0755 packaging/diagnostics/archverse-location-sync-diagnostic \
            "$WORK_ROOT/bin/archverse-location-sync-diagnostic"

          python3 - "$WORK_ROOT/app/package.json" "$APP_VERSION" <<'PY'
          import json, sys
          from pathlib import Path
          p=Path(sys.argv[1]); d=json.loads(p.read_text()); d['version']=sys.argv[2]
          d['description']='ArchVerse Alpha22 Candidate 7b: durable one-shot Location Sync result handoff'
          p.write_text(json.dumps(d, indent=2)+'\n')
          PY
          mv "$WORK_ROOT" "$FINAL_ROOT"

      - name: Assert frozen Linux and Candidate 7b contracts
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/native/ArchVerse-Native-$APP_VERSION"
          find "$ROOT/app/electron" -type f \( -name '*.cjs' -o -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
          node --check "$ROOT/app/server/server.mjs"

          grep -q 'keyboard authority=evdev' "$ROOT/app/electron/main.cjs"
          grep -q '__overlayClassifyPoint' "$ROOT/app/electron/main.cjs"
          grep -q 'function updateFHoverHit()' "$ROOT/app/electron/main.cjs"
          ! grep -q 'pointIsInsideOverlayRegion(' "$ROOT/app/electron/main.cjs"
          ! grep -q 'overlay\.setFocusable(false)' "$ROOT/app/electron/main.cjs"

          grep -q 'ARCHVERSE_LINUX_GAMESCOPE_PIPEWIRE_CAPTURE' "$ROOT/app/electron/capture.cjs"
          grep -q 'ARCHVERSE_LINUX_PIPEWIRE_REPROBE' "$ROOT/app/electron/capture.cjs"
          grep -q 'ARCHVERSE_LINUX_BACKGROUND_OCR_NONBLOCKING' "$ROOT/app/electron/capture.cjs"
          grep -q 'ARCHVERSE_LINUX_MINING_COORDINATE_AUTHORITY' "$ROOT/app/electron/capture.cjs"
          grep -q 'ARCHVERSE_LINUX_MINING_SCALE_GUARD' "$ROOT/app/electron/capture.cjs"
          grep -q 'ARCHVERSE_LINUX_ASYNC_MINING_TELEMETRY' "$ROOT/app/electron/capture.cjs"
          grep -q 'ARCHVERSE_LINUX_WINDOWS_OCR_HARD_DENY' "$ROOT/app/server/server.mjs"
          ! grep -REq 'taskset|sched_setaffinity|SCHED_FIFO|SCHED_RR' "$ROOT/app/electron" "$ROOT/bin"

          grep -q 'ARCHVERSE_LOCATION_SYNC_V3_CAPTURE' "$ROOT/app/electron/capture.cjs"
          grep -q 'ARCHVERSE_LOCATION_SYNC_V3_ONE_SHOT' "$ROOT/app/electron/capture.cjs"
          grep -q 'linuxOcrLane("locationSync")' "$ROOT/app/electron/capture.cjs"
          grep -q 'pipewiresrc' "$ROOT/app/electron/capture.cjs"
          grep -q 'method: "gamescope-pipewire"' "$ROOT/app/electron/capture.cjs"
          grep -q 'HAULING_LOCATE_SNAP_M = 12_000' "$ROOT/app/server/server.mjs"
          ! grep -q 'Windows\.Media\.Ocr' "$ROOT/app/electron/location-sync-v3.cjs"

          grep -q 'ARCHVERSE_LOCATION_SYNC_DURABLE_HANDOFF' "$ROOT/app/electron/capture.cjs"
          grep -q 'location-sync-result.json' "$ROOT/app/electron/capture.cjs"
          grep -q 'postLocationResultFast' "$ROOT/app/electron/capture.cjs"
          grep -q 'AbortSignal.timeout(1200)' "$ROOT/app/electron/capture.cjs"
          ! grep -q 'AbortSignal.timeout(3500)' "$ROOT/app/electron/capture.cjs"
          ! grep -Eq 'await[[:space:]]+postLocationResult\b' "$ROOT/app/electron/capture.cjs"
          grep -q 'ARCHVERSE_LOCATION_SYNC_DURABLE_CONSUMER' "$ROOT/app/server/server.mjs"
          grep -q 'deliveryTransport' "$ROOT/app/server/server.mjs"
          grep -q 'ARCHVERSE_LOCATION_SYNC_DURABLE_UI' "$ROOT/app/server/overlay/hauling.html"
          jq -e --arg v "$APP_VERSION" '.version == $v' "$ROOT/app/package.json"

      - name: Exercise durable Location Sync handoff
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/native/ArchVerse-Native-$APP_VERSION"
          CFG="$RUNNER_TEMP/location-sync-handoff"; PORT=18787
          mkdir -p "$CFG"
          SC_TRACKER_CONFIG_DIR="$CFG" PORT="$PORT" node "$ROOT/app/server/server.mjs" >"$RUNNER_TEMP/location-sync-server.log" 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 100); do curl -fsS "http://127.0.0.1:$PORT/api/config" >/dev/null 2>&1 && break; sleep .1; done

          ARM="$(curl -fsS -X POST "http://127.0.0.1:$PORT/api/hauling/locate")"
          AT="$(jq -r .at <<<"$ARM")"
          DONE="$(( $(date +%s%3N) - 250 ))"
          jq -n --argjson at "$AT" --argjson done "$DONE" '{schema:"archverse-location-sync-result/1",completedAt:$done,requestAt:$at,pos:{x:200552.3,y:-104907.3,z:190095.1},frame:"body",body:"Daymar",system:"Stanton",source:"zone-body",captureMethod:"gamescope-pipewire",captureMs:1394,ocrMs:2170,totalMs:3600,engine:"rapidocr"}' >"$CFG/location-sync-result.json.tmp"
          chmod 600 "$CFG/location-sync-result.json.tmp"
          mv "$CFG/location-sync-result.json.tmp" "$CFG/location-sync-result.json"

          RESULT="$(curl -fsS "http://127.0.0.1:$PORT/api/hauling/locate")"
          jq -e '.pending == false and .result.ok == true and .result.frame == "body" and .result.body == "Daymar" and .result.deliveryTransport == "durable-file"' <<<"$RESULT"
          test ! -e "$CFG/location-sync-result.json"

          ARM2="$(curl -fsS -X POST "http://127.0.0.1:$PORT/api/hauling/locate")"
          AT2="$(jq -r .at <<<"$ARM2")"
          test "$AT2" != "$AT"
          jq -n --argjson at "$AT" '{completedAt:0,requestAt:$at,pos:{x:1,y:2,z:3},frame:"system",system:"Nyx"}' >"$CFG/location-sync-result.json"
          STALE="$(curl -fsS "http://127.0.0.1:$PORT/api/hauling/locate")"
          jq -e '.pending == true and .result == null' <<<"$STALE"
          test ! -e "$CFG/location-sync-result.json"
          grep -q 'durable result consumed' "$RUNNER_TEMP/location-sync-server.log"
          grep -q 'discarded durable result: stale-request' "$RUNNER_TEMP/location-sync-server.log"

      - name: Run Linux OCR self-tests
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/native/ArchVerse-Native-$APP_VERSION"
          node packaging/common/native-linux-ocr-selftest.mjs "$ROOT"
          (cd "$ROOT/app" && node "$GITHUB_WORKSPACE/packaging/common/rapidocr-native-selftest.mjs")

      - name: Package Candidate 7b
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -C "$RUNNER_TEMP/native" -czf "dist/ArchVerse-Native-$APP_VERSION.tar.gz" "ArchVerse-Native-$APP_VERSION"
          (cd dist && sha256sum "ArchVerse-Native-$APP_VERSION.tar.gz" > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: ArchVerse-0.1.44-Alpha22-Candidate7b
          path: |
            dist/ArchVerse-Native-${{ env.APP_VERSION }}.tar.gz
            dist/SHA256SUMS
            ${{ runner.temp }}/location-sync-server.log
          if-no-files-found: error
          compression-level: 0
