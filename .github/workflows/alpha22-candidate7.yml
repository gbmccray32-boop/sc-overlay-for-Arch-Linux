name: Alpha22 Candidate 7 Location Sync V3

on:
  push:
    branches:
      - agent/alpha22-candidate7-location-sync-v3
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: alpha22-candidate7-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_VERSION: 0.1.44-r31.alpha22.candidate7
  VERIFIED_ALPHA21_CORE_RUN_ID: '31901404904'
  VERIFIED_ALPHA21_CORE_ARTIFACT_ID: '9251185299'
  VERIFIED_ALPHA21_CORE_ARTIFACT: ArchVerse-Alpha21-native-payload
  VERIFIED_ALPHA21_CORE_DIGEST: sha256:6a6e05eeb8f7a91e06d5a60fb1b93230a3d6564c66741a71642926191815bbca
  VERIFIED_ALPHA21_CORE_HEAD_SHA: 9f3c095b74c5220b7720717c5bb8d6ed2bc28382
  VERIFIED_ALPHA21_CORE_PAYLOAD: ArchVerse-Overlay-0.1.42-r31-alpha.21-payload.tar.gz
  ELECTRON_ASSET: electron-v42.7.1-linux-x64.zip
  ELECTRON_SHA256: e85b28245deaa75c3c4f2cf5da084f4c7fbedd5af1630c59a827c41ac1f5e1af

jobs:
  build-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Validate source and Location Sync fixtures
        run: |
          set -euo pipefail
          npm run typecheck
          npm run test:mining
          npm run test:screenocr
          npm run test:hauling
          npm run test:location
          npm run build:server
          node --check build/server/server.mjs
          node --check packaging/common/enforce-alpha22-performance-repair.cjs
          node --check packaging/common/enforce-alpha22-field-fixes.cjs
          node --check packaging/common/enforce-alpha22-first-f.cjs
          node --check packaging/common/enforce-alpha22-scan-lane-stall-fixes.cjs
          node --check packaging/common/enforce-location-sync-v3.cjs
          node --check packaging/common/location-sync-v3.cjs
          node tests/location-sync-v3.test.cjs

      - name: Verify pinned Alpha21 core provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          meta="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$VERIFIED_ALPHA21_CORE_ARTIFACT_ID")"
          test "$(jq -r .name <<<"$meta")" = "$VERIFIED_ALPHA21_CORE_ARTIFACT"
          test "$(jq -r .expired <<<"$meta")" = "false"
          test "$(jq -r .digest <<<"$meta")" = "$VERIFIED_ALPHA21_CORE_DIGEST"
          test "$(jq -r .workflow_run.id <<<"$meta")" = "$VERIFIED_ALPHA21_CORE_RUN_ID"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_ALPHA21_CORE_RUN_ID" --jq .head_sha)" = "$VERIFIED_ALPHA21_CORE_HEAD_SHA"

      - name: Download pinned Alpha21 core
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.VERIFIED_ALPHA21_CORE_ARTIFACT }}
          path: ${{ runner.temp }}/verified-alpha21-core
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.VERIFIED_ALPHA21_CORE_RUN_ID }}

      - name: Download pinned Electron
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sources"
          curl --fail --location --retry 4 \
            "https://github.com/electron/electron/releases/download/v42.7.1/$ELECTRON_ASSET" \
            --output "$RUNNER_TEMP/sources/$ELECTRON_ASSET"
          echo "$ELECTRON_SHA256  $RUNNER_TEMP/sources/$ELECTRON_ASSET" | sha256sum -c -

      - name: Reconstruct Candidate 7 runtime
        run: |
          set -euo pipefail
          STAGE_ROOT="$RUNNER_TEMP/native/ArchVerse-Native-$APP_VERSION"
          bash packaging/native/stage-upstream-0144-candidate.sh \
            "$RUNNER_TEMP/verified-alpha21-core/$VERIFIED_ALPHA21_CORE_PAYLOAD" \
            "$RUNNER_TEMP/sources/$ELECTRON_ASSET" \
            "$STAGE_ROOT"
          # Ordering is deliberate. OCR architecture rewrite can replace capture.cjs, so PipeWire is reapplied after it.
          node packaging/common/enforce-native-linux-pipewire-capture.cjs "$STAGE_ROOT"
          node packaging/common/enforce-alpha22-performance-repair.cjs "$STAGE_ROOT"
          node packaging/common/enforce-alpha22-field-fixes.cjs "$STAGE_ROOT"
          node packaging/common/enforce-alpha22-first-f.cjs "$STAGE_ROOT"
          node packaging/common/enforce-alpha22-scan-lane-stall-fixes.cjs "$STAGE_ROOT"
          node packaging/common/enforce-location-sync-v3.cjs "$STAGE_ROOT"

          install -m 0644 packaging/diagnostics/location-sync-diagnostic.cjs \
            "$STAGE_ROOT/app/electron/location-sync-diagnostic.cjs"
          install -m 0755 packaging/diagnostics/archverse-location-sync-diagnostic \
            "$STAGE_ROOT/bin/archverse-location-sync-diagnostic"

      - name: Assert Candidate 7 contracts
        run: |
          set -euo pipefail
          STAGE_ROOT="$RUNNER_TEMP/native/ArchVerse-Native-$APP_VERSION"
          find "$STAGE_ROOT/app/electron" -type f \( -name '*.cjs' -o -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
          node --check "$STAGE_ROOT/app/server/server.mjs"

          # Frozen field-pass interaction contract.
          grep -q 'F keyboard authority=evdev' "$STAGE_ROOT/app/electron/main.cjs"
          grep -q '__overlayClassifyPoint' "$STAGE_ROOT/app/electron/main.cjs"
          grep -q 'function updateFHoverHit()' "$STAGE_ROOT/app/electron/main.cjs"
          ! grep -q 'pointIsInsideOverlayRegion(' "$STAGE_ROOT/app/electron/main.cjs"
          ! grep -q 'overlay\.setFocusable(false)' "$STAGE_ROOT/app/electron/main.cjs"

          # Frozen Linux capture/OCR/mining contract.
          grep -q 'ARCHVERSE_LINUX_GAMESCOPE_PIPEWIRE_CAPTURE' "$STAGE_ROOT/app/electron/capture.cjs"
          grep -q 'ARCHVERSE_LINUX_PIPEWIRE_REPROBE' "$STAGE_ROOT/app/electron/capture.cjs"
          grep -q 'ARCHVERSE_LINUX_BACKGROUND_OCR_NONBLOCKING' "$STAGE_ROOT/app/electron/capture.cjs"
          grep -q 'ARCHVERSE_LINUX_MINING_COORDINATE_AUTHORITY' "$STAGE_ROOT/app/electron/capture.cjs"
          grep -q 'ARCHVERSE_LINUX_MINING_SCALE_GUARD' "$STAGE_ROOT/app/electron/capture.cjs"
          grep -q 'ARCHVERSE_LINUX_ASYNC_MINING_TELEMETRY' "$STAGE_ROOT/app/electron/capture.cjs"
          grep -q 'ARCHVERSE_LINUX_WINDOWS_OCR_HARD_DENY' "$STAGE_ROOT/app/server/server.mjs"
          ! grep -REq 'taskset|sched_setaffinity|SCHED_FIFO|SCHED_RR' "$STAGE_ROOT/app/electron" "$STAGE_ROOT/bin"

          # Location Sync V3: one-shot, full-canvas top-right, direct PipeWire, Linux OCR lane.
          grep -q 'ARCHVERSE_LOCATION_SYNC_V3_CAPTURE' "$STAGE_ROOT/app/electron/capture.cjs"
          grep -q 'ARCHVERSE_LOCATION_SYNC_V3_ONE_SHOT' "$STAGE_ROOT/app/electron/capture.cjs"
          grep -q 'linuxOcrLane("locationSync")' "$STAGE_ROOT/app/electron/capture.cjs"
          grep -q 'pipewiresrc' "$STAGE_ROOT/app/electron/capture.cjs"
          grep -q 'method: "gamescope-pipewire"' "$STAGE_ROOT/app/electron/capture.cjs"
          grep -q 'ARCHVERSE_LOCATION_SYNC_V3_API' "$STAGE_ROOT/app/server/server.mjs"
          grep -q 'ARCHVERSE_LOCATION_SYNC_V3_PLAN' "$STAGE_ROOT/app/server/server.mjs"
          grep -q 'ARCHVERSE_LOCATION_SYNC_V3_UI' "$STAGE_ROOT/app/server/overlay/hauling.html"
          grep -q 'HAULING_LOCATE_SNAP_M = 12_000' "$STAGE_ROOT/app/server/server.mjs"
          ! grep -q 'Windows\.Media\.Ocr' "$STAGE_ROOT/app/electron/location-sync-v3.cjs"

          # Run the parser/matcher fixture against the exact staged module.
          node - "$STAGE_ROOT" <<'NODE'
          const assert=require('node:assert/strict');
          const root=process.argv[2];
          const m=require(root+'/app/electron/location-sync-v3.cjs');
          const d=m.parseDisplayInfoLines([
            'Zone: 00c Stanton 2b Daymar Pos: 200.5523km -104.9073km 190.0951km',
            'Zone: SolarSystem 742312208505 Pos: -18930616.1288km -2609945.7846km 190.0951km',
            'Zone: Ro0t Pos: -18930616.1288km -2609945.7846km 190.0951km',
            'Current player location : Stanton2b EMshelter EagerFlats  (LZ : Stanton2b EMShelter EagerFlats)',
            'Planet:ooc Stanton 2b Daymar (working) (Load Complete)'
          ]);
          assert.equal(d.ok,true); assert.equal(d.frame,'body'); assert.equal(d.body,'Daymar');
          assert.deepEqual(d.pos,{x:200552.3,y:-104907.3,z:190095.1});
          const l=m.parseDisplayInfoLines([
            'Zone: SolarSystem 729696722768 Pos: -9641671.0001km -11490733.6711km -91.8108km',
            'Zone: Ro0t Pos: -9641671.0001km -11490733.6711km -91.8108km',
            'Current player location : Nyx Levski (Lz : Nyx Levski)', 'No Current Planet'
          ]);
          assert.equal(l.ok,true); assert.equal(l.frame,'system'); assert.equal(l.system,'Nyx');
          const g=m.locationCropGeometry(6360,2160);
          assert.deepEqual(g.crop,{x:3960,y:0,width:2400,height:900});
          NODE

      - name: Run Linux OCR self-tests
        run: |
          set -euo pipefail
          STAGE_ROOT="$RUNNER_TEMP/native/ArchVerse-Native-$APP_VERSION"
          node packaging/common/native-linux-ocr-selftest.mjs "$STAGE_ROOT"
          (cd "$STAGE_ROOT/app" && node "$GITHUB_WORKSPACE/packaging/common/rapidocr-native-selftest.mjs")

      - name: Package Candidate 7
        run: |
          set -euo pipefail
          mkdir -p dist
          STAGE_ROOT="$RUNNER_TEMP/native/ArchVerse-Native-$APP_VERSION"
          tar -C "$RUNNER_TEMP/native" -czf "dist/ArchVerse-Native-$APP_VERSION.tar.gz" "ArchVerse-Native-$APP_VERSION"
          (cd dist && sha256sum "ArchVerse-Native-$APP_VERSION.tar.gz" > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: ArchVerse-0.1.44-Alpha22-Candidate7
          path: |
            dist/ArchVerse-Native-${{ env.APP_VERSION }}.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
