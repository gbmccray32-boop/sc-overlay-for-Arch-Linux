name: Location Sync PipeWire Diagnostic

on:
  push:
    branches:
      - agent/location-sync-pipewire-diagnostic-v1
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: location-sync-pipewire-diagnostic-${{ github.ref }}
  cancel-in-progress: true

env:
  DIAG_VERSION: 0.1.44-r31.alpha22.location-sync-diag1
  VERIFIED_ALPHA21_CORE_RUN_ID: '31901404904'
  VERIFIED_ALPHA21_CORE_ARTIFACT_ID: '9251185299'
  VERIFIED_ALPHA21_CORE_ARTIFACT: ArchVerse-Alpha21-native-payload
  VERIFIED_ALPHA21_CORE_DIGEST: sha256:6a6e05eeb8f7a91e06d5a60fb1b93230a3d6564c66741a71642926191815bbca
  VERIFIED_ALPHA21_CORE_HEAD_SHA: 9f3c095b74c5220b7720717c5bb8d6ed2bc28382
  VERIFIED_ALPHA21_CORE_PAYLOAD: ArchVerse-Overlay-0.1.42-r31-alpha.21-payload.tar.gz
  ELECTRON_ASSET: electron-v42.7.1-linux-x64.zip
  ELECTRON_SHA256: e85b28245deaa75c3c4f2cf5da084f4c7fbedd5af1630c59a827c41ac1f5e1af

jobs:
  build:
    name: Build isolated PipeWire CamPos diagnostic
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Validate diagnostic source
        run: |
          set -euo pipefail
          node --check packaging/diagnostics/location-sync-diagnostic.cjs
          bash -n packaging/diagnostics/archverse-location-sync-diagnostic
          grep -q 'ARCHVERSE_LOCATION_SYNC_PIPEWIRE_DIAGNOSTIC_V1' packaging/diagnostics/location-sync-diagnostic.cjs
          grep -q 'Gamescope PipeWire node' packaging/diagnostics/location-sync-diagnostic.cjs
          grep -q 'pipewiresrc' packaging/diagnostics/location-sync-diagnostic.cjs
          grep -q 'CamPos' packaging/diagnostics/location-sync-diagnostic.cjs
          grep -q 'Only bounded top-right CamPos search crops are persisted' packaging/diagnostics/location-sync-diagnostic.cjs
          ! grep -q 'types:.*screen' packaging/diagnostics/location-sync-diagnostic.cjs

      - name: Install exact source dependencies
        run: npm ci

      - name: Build current sidecar used by the candidate shell
        run: |
          set -euo pipefail
          npm run typecheck
          npm run build:server
          test -s build/server/server.mjs

      - name: Verify pinned Alpha21 Linux core provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          meta="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$VERIFIED_ALPHA21_CORE_ARTIFACT_ID")"
          test "$(jq -r .name <<<"$meta")" = "$VERIFIED_ALPHA21_CORE_ARTIFACT"
          test "$(jq -r .expired <<<"$meta")" = "false"
          test "$(jq -r .digest <<<"$meta")" = "$VERIFIED_ALPHA21_CORE_DIGEST"
          test "$(jq -r .workflow_run.id <<<"$meta")" = "$VERIFIED_ALPHA21_CORE_RUN_ID"
          run_head="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_ALPHA21_CORE_RUN_ID" --jq .head_sha)"
          test "$run_head" = "$VERIFIED_ALPHA21_CORE_HEAD_SHA"

      - name: Download pinned Alpha21 Linux core
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.VERIFIED_ALPHA21_CORE_ARTIFACT }}
          path: ${{ runner.temp }}/verified-alpha21-core
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.VERIFIED_ALPHA21_CORE_RUN_ID }}

      - name: Download and verify pinned Electron
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sources"
          curl --fail --location --retry 4 \
            "https://github.com/electron/electron/releases/download/v42.7.1/$ELECTRON_ASSET" \
            --output "$RUNNER_TEMP/sources/$ELECTRON_ASSET"
          echo "$ELECTRON_SHA256  $RUNNER_TEMP/sources/$ELECTRON_ASSET" | sha256sum -c -

      - name: Stage verified ArchVerse Linux candidate core
        run: |
          set -euo pipefail
          STAGE_PARENT="$RUNNER_TEMP/location-diag"
          STAGE_ROOT="$STAGE_PARENT/ArchVerse-Location-Sync-Diagnostic-$DIAG_VERSION"
          mkdir -p "$STAGE_PARENT"
          bash packaging/native/stage-upstream-0144-candidate.sh \
            "$RUNNER_TEMP/verified-alpha21-core/$VERIFIED_ALPHA21_CORE_PAYLOAD" \
            "$RUNNER_TEMP/sources/$ELECTRON_ASSET" \
            "$STAGE_ROOT"

          # The known-good low-latency capture layer must be applied after the OCR architecture
          # rewrite, exactly as required by the permanent Linux porting contract.
          node packaging/common/enforce-native-linux-pipewire-capture.cjs "$STAGE_ROOT"

          install -m 0644 packaging/diagnostics/location-sync-diagnostic.cjs \
            "$STAGE_ROOT/app/electron/location-sync-diagnostic.cjs"
          install -m 0755 packaging/diagnostics/archverse-location-sync-diagnostic \
            "$STAGE_ROOT/bin/archverse-location-sync-diagnostic"

          node --check "$STAGE_ROOT/app/electron/location-sync-diagnostic.cjs"
          bash -n "$STAGE_ROOT/bin/archverse-location-sync-diagnostic"
          test -x "$STAGE_ROOT/runtime/electron/electron"
          test -s "$STAGE_ROOT/app/electron/rapidocr-client.cjs"
          test -s "$STAGE_ROOT/app/electron/rapidocr-worker.cjs"
          test -s "$STAGE_ROOT/app/electron/linux/star-citizen-session.cjs"
          test -s "$STAGE_ROOT/app/electron/native-linux-gamescope-pipewire.cjs"
          grep -q 'ARCHVERSE_LINUX_GAMESCOPE_PIPEWIRE_CAPTURE' "$STAGE_ROOT/app/electron/native-linux-gamescope-pipewire.cjs"
          grep -q 'pipewiresrc' "$STAGE_ROOT/app/electron/native-linux-gamescope-pipewire.cjs"
          grep -q 'method: "gamescope-pipewire"' "$STAGE_ROOT/app/electron/capture.cjs"
          grep -q 'ARCHVERSE_LOCATION_SYNC_PIPEWIRE_DIAGNOSTIC_V1' "$STAGE_ROOT/app/electron/location-sync-diagnostic.cjs"
          grep -q 'pipewiresrc' "$STAGE_ROOT/app/electron/location-sync-diagnostic.cjs"
          grep -q 'electron-game-window-fallback' "$STAGE_ROOT/app/electron/location-sync-diagnostic.cjs"
          grep -q 'XDG_STATE_HOME' "$STAGE_ROOT/app/electron/location-sync-diagnostic.cjs"
          ! grep -q 'types:.*screen' "$STAGE_ROOT/app/electron/location-sync-diagnostic.cjs"

          # Keep this artifact self-identifying and impossible to confuse with a normal candidate.
          python3 - "$STAGE_ROOT/app/package.json" "$DIAG_VERSION" <<'PY'
          from pathlib import Path
          import json, sys
          p=Path(sys.argv[1]); version=sys.argv[2]; d=json.loads(p.read_text())
          d['version']=version
          d['description']='QUARANTINED ArchVerse Linux diagnostic: compare direct Gamescope PipeWire and Electron game-window CamPos OCR; not a release build'
          p.write_text(json.dumps(d, indent=2)+'\n')
          PY

          cat > "$STAGE_ROOT/LOCATION-SYNC-DIAGNOSTIC.txt" <<'EOF'
          ARCHVERSE LOCATION SYNC PIPEWIRE DIAGNOSTIC

          This is NOT a release candidate and does not install the upstream location-sync feature.

          Run:
            ./bin/archverse-location-sync-diagnostic

          Before the countdown ends, enable `r_DisplayInfo 1` in Star Citizen and focus the game.

          The diagnostic compares:
            - direct Gamescope PipeWire (`gamescope-pipewire` / `Gamescope PipeWire node <id>`)
            - Electron's explicit Gamescope/Star Citizen window source (fallback comparison)

          It saves only bounded top-right CamPos OCR crops plus location-sync-result.json under:
            ${XDG_STATE_HOME:-$HOME/.local/state}/archverse-overlay/location-sync-diagnostic/

          It does not write a full-screen capture and does not modify hauling state.
          EOF

          mkdir -p dist
          tar -C "$STAGE_PARENT" -czf \
            "dist/ArchVerse-Location-Sync-Diagnostic-$DIAG_VERSION.tar.gz" \
            "ArchVerse-Location-Sync-Diagnostic-$DIAG_VERSION"
          (cd dist && sha256sum "ArchVerse-Location-Sync-Diagnostic-$DIAG_VERSION.tar.gz" > SHA256SUMS)

      - name: Upload quarantined diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: ArchVerse-Location-Sync-PipeWire-Diagnostic
          path: |
            dist/ArchVerse-Location-Sync-Diagnostic-${{ env.DIAG_VERSION }}.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
