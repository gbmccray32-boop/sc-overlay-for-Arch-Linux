name: Verify ArchVerse r28 release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-r28:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify published r28 archive
        shell: bash
        run: |
          set -euo pipefail
          asset="ArchVerse-Overlay-linux-v0.1.33-r28.tar.gz"
          expected="f1143274930eb332b3581def5156852780da4a83af5a1d607bb513ef1eeaff43"
          url="https://github.com/gbmccray32-boop/sc-overlay-for-Arch-Linux/releases/download/linux-v0.1.33-r28/$asset"

          curl --fail --location --retry 3 --output "$asset" "$url"
          printf '%s  %s\n' "$expected" "$asset" | sha256sum -c -

          mkdir -p /tmp/archverse-r28
          tar -xzf "$asset" -C /tmp/archverse-r28 --strip-components=1
          /tmp/archverse-r28/verify-release.sh
