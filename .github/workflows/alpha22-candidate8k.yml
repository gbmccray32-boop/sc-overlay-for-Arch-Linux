name: Alpha22 Candidate 8k Sidecar Supervision Repair

on:
  push:
    branches: [agent/alpha22-candidate8k-sidecar-supervision-repair]
    paths-ignore:
      - docs/ARCHVERSE-CONTINUITY.md
      - ARCHVERSE-HANDOFF.generated.md
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: alpha22-candidate8k-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_VERSION: 0.1.44-r31.alpha22.candidate8k
  BASE_VERSION: 0.1.44-r31.alpha22.candidate8j
  VERIFIED_C8J_RUN_ID: '34043540649'
  VERIFIED_C8J_ARTIFACT_ID: '9992407560'
  VERIFIED_C8J_ARTIFACT: ArchVerse-0.1.44-Alpha22-Candidate8j
  VERIFIED_C8J_ARTIFACT_DIGEST: sha256:80c072a7d182a45d3284f48f19f419cc29baaaecc7188daaffd91d5ddaf1dc68
  VERIFIED_C8J_HEAD_SHA: 7753b9d1ecaf112d8a17162a5bf1dd48914f35b9
  VERIFIED_C8J_TARBALL_SHA256: f1a0b144e176aa2e3ec641e42370d650f58d1a6b321cd6364c7c04ff1c4066b6

jobs:
  build-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Validate Candidate 8k source tools
        run: |
          set -euo pipefail
          node --check packaging/common/apply-alpha22-candidate8k.cjs
          node --check packaging/common/candidate8k-sidecar-watchdog.cjs
          node --check packaging/common/candidate8k-sidecar-supervision-selftest.mjs

      - name: Verify pinned Candidate 8j provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          meta="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$VERIFIED_C8J_ARTIFACT_ID")"
          test "$(jq -r .name <<<"$meta")" = "$VERIFIED_C8J_ARTIFACT"
          test "$(jq -r .expired <<<"$meta")" = false
          test "$(jq -r .digest <<<"$meta")" = "$VERIFIED_C8J_ARTIFACT_DIGEST"
          test "$(jq -r .workflow_run.id <<<"$meta")" = "$VERIFIED_C8J_RUN_ID"
          test "$(jq -r .workflow_run.head_sha <<<"$meta")" = "$VERIFIED_C8J_HEAD_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_C8J_RUN_ID" --jq .conclusion)" = success

      - name: Download pinned Candidate 8j artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.VERIFIED_C8J_ARTIFACT }}
          path: ${{ runner.temp }}/candidate8j-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.VERIFIED_C8J_RUN_ID }}

      - name: Verify and extract exact Candidate 8j package
        run: |
          set -euo pipefail
          TARBALL="$(find "$RUNNER_TEMP/candidate8j-artifact" -type f -name "ArchVerse-Native-$BASE_VERSION.tar.gz" -print -quit)"
          test -n "$TARBALL"
          test "$(sha256sum "$TARBALL" | awk '{print $1}')" = "$VERIFIED_C8J_TARBALL_SHA256"
          mkdir -p "$RUNNER_TEMP/native"
          tar --no-same-owner -C "$RUNNER_TEMP/native" -xzf "$TARBALL"
          ROOT="$RUNNER_TEMP/native/ArchVerse-Native-$BASE_VERSION"
          jq -e --arg v "$BASE_VERSION" '.version == $v' "$ROOT/app/package.json"

      - name: Recheck Candidate 8j Mining baseline
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/native/ArchVerse-Native-$BASE_VERSION"
          node packaging/common/candidate8j-mining-transport-selftest.mjs "$ROOT"

      - name: Apply Candidate 8k supervision repair
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/native/ArchVerse-Native-$BASE_VERSION"
          node packaging/common/apply-alpha22-candidate8k.cjs "$ROOT"
          mv "$ROOT" "$RUNNER_TEMP/native/ArchVerse-Native-$APP_VERSION"

      - name: Assert frozen Mining and Linux contracts
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/native/ArchVerse-Native-$APP_VERSION"
          find "$ROOT/app/electron" -type f \( -name '*.cjs' -o -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
          node --check "$ROOT/app/server/server.mjs"

          test "$(sha256sum "$ROOT/app/server/server.mjs" | awk '{print $1}')" = e572e2f4e806a3a354dd7fa44689c8703c608ba7349295e1483949a42b441ec2
          test "$(sha256sum "$ROOT/app/electron/mining-result-transport.cjs" | awk '{print $1}')" = 380274e0af93cef2b130f7ab9eda8a5725211f908c8c00acc8c3a6954b738dde
          test "$(sha256sum "$ROOT/app/electron/mining-vehicle-presence.cjs" | awk '{print $1}')" = f28eb7ca09e3796e6564f90c4a5eb6066a8d13332fe2c9ad4e347f80c02a5cc9
          test "$(sha256sum "$ROOT/app/electron/mining-signature-catalog.cjs" | awk '{print $1}')" = 09dfd261b2f4b2e261a01abd2d117259970b939ac199a3658d094fd260e16ed6
          test "$(sha256sum "$ROOT/app/electron/persistent-gamescope-pipewire.cjs" | awk '{print $1}')" = 831fdf3584cfa0cd0df15076ab0d6a5c5e010c842b12f08bf3c87ec82333b07b

          grep -q 'keyboard authority=evdev' "$ROOT/app/electron/main.cjs"
          grep -q '__overlayClassifyPoint' "$ROOT/app/electron/main.cjs"
          grep -q 'ARCHVERSE_LINUX_GAMESCOPE_PIPEWIRE_CAPTURE' "$ROOT/app/electron/capture.cjs"
          grep -q 'ARCHVERSE_LINUX_GAMESCOPE_PIPEWIRE_PERSISTENT_STREAM' "$ROOT/app/electron/capture.cjs"
          grep -q 'multifilesink' "$ROOT/app/electron/persistent-gamescope-pipewire.cjs"
          grep -q 'leaky=downstream' "$ROOT/app/electron/persistent-gamescope-pipewire.cjs"
          grep -q 'ARCHVERSE_LINUX_MINING_NONBLOCKING_COMMIT' "$ROOT/app/electron/capture.cjs"
          grep -q 'ARCHVERSE_LINUX_MINING_STABLE_CADENCE' "$ROOT/app/electron/capture.cjs"
          grep -q 'ARCHVERSE_LINUX_SIDECAR_HEALTH_WATCHDOG_V2' "$ROOT/app/electron/sidecar-health-watchdog.cjs"
          grep -q 'ARCHVERSE_LINUX_WATCHDOG_RECOVERY_NOT_CRASH' "$ROOT/app/electron/main.cjs"
          ! grep -Rq '/api/vehicle-presence/events' "$ROOT/app/electron" "$ROOT/app/server/server.mjs"
          ! grep -REq 'taskset|sched_setaffinity|SCHED_FIFO|SCHED_RR' "$ROOT/app/electron" "$ROOT/bin"
          jq -e --arg v "$APP_VERSION" '.version == $v' "$ROOT/app/package.json"

      - name: Exercise Candidate 8k supervision regressions
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/native/ArchVerse-Native-$APP_VERSION"
          node packaging/common/candidate8k-sidecar-supervision-selftest.mjs "$ROOT"

      - name: Package Candidate 8k
        run: |
          set -euo pipefail
          mkdir -p dist
          tar --owner=0 --group=0 -C "$RUNNER_TEMP/native" -czf "dist/ArchVerse-Native-$APP_VERSION.tar.gz" "ArchVerse-Native-$APP_VERSION"
          (cd dist && sha256sum "ArchVerse-Native-$APP_VERSION.tar.gz" > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: ArchVerse-0.1.44-Alpha22-Candidate8k
          path: |
            dist/ArchVerse-Native-${{ env.APP_VERSION }}.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
