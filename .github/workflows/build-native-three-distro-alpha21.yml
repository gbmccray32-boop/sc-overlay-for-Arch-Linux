name: Build ArchVerse Alpha 21 native packages

on:
  push:
    branches:
      - packaging/native-three-distro-alpha21
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-alpha21-${{ github.ref }}
  cancel-in-progress: true

env:
  ELECTRON_VERSION: 42.7.1
  ELECTRON_ASSET: electron-v42.7.1-linux-x64.zip
  ELECTRON_SHA256: e85b28245deaa75c3c4f2cf5da084f4c7fbedd5af1630c59a827c41ac1f5e1af

jobs:
  payload:
    name: Rebuild tested Alpha 21 payload
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Download durable Alpha 20 baseline
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/alpha20"
          gh release download v0.1.42-r31-alpha.20 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'ArchVerse-Overlay-0.1.42-r31-alpha.20-arch.tar.gz' \
            --dir "$RUNNER_TEMP/alpha20"
          echo 'f4256aeac8c13fb0a64fc6065a8869bf58015dbe694200a550aaf9e99e3dd0a6  '"$RUNNER_TEMP/alpha20/ArchVerse-Overlay-0.1.42-r31-alpha.20-arch.tar.gz" | sha256sum -c -

      - name: Reconstruct and verify Alpha 21
        shell: bash
        run: |
          set -euo pipefail
          chmod +x packaging/common/rebuild-alpha21-from-alpha20.sh
          packaging/common/rebuild-alpha21-from-alpha20.sh \
            "$RUNNER_TEMP/alpha20/ArchVerse-Overlay-0.1.42-r31-alpha.20-arch.tar.gz" \
            "$RUNNER_TEMP/ArchVerse-Overlay-0.1.42-r31-alpha.21-payload.tar.gz"
          tar -tzf "$RUNNER_TEMP/ArchVerse-Overlay-0.1.42-r31-alpha.21-payload.tar.gz" \
            > "$RUNNER_TEMP/alpha21-payload-files.txt"
          grep -q 'ArchVerse-Overlay-0.1.42-r31-alpha.21/app/electron/main.cjs' \
            "$RUNNER_TEMP/alpha21-payload-files.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: ArchVerse-Alpha21-native-payload
          path: ${{ runner.temp }}/ArchVerse-Overlay-0.1.42-r31-alpha.21-payload.tar.gz
          if-no-files-found: error
          retention-days: 30

  arch:
    name: Arch / CachyOS package
    needs: payload
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 35
    steps:
      - name: Prepare Arch build container
        shell: bash
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed git sudo
          useradd -m builder

      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ArchVerse-Alpha21-native-payload
          path: packaging/arch

      - name: Build pacman package
        shell: bash
        run: |
          set -euo pipefail
          cp packaging/common/archverse-overlay packaging/arch/
          cp packaging/common/archverse-overlay.desktop packaging/arch/
          chmod 0755 packaging/arch/archverse-overlay
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE/packaging/arch' && makepkg --nodeps --noconfirm --cleanbuild"
          mkdir -p "$GITHUB_WORKSPACE/dist-arch"
          cp packaging/arch/*.pkg.tar.* "$GITHUB_WORKSPACE/dist-arch/"
          pkg="$(find "$GITHUB_WORKSPACE/dist-arch" -type f -name '*.pkg.tar.*' -print -quit)"
          test -n "$pkg"
          pacman -Qip "$pkg"
          pacman -Qlp "$pkg" | grep -E '/usr/bin/archverse-overlay$|/opt/archverse-overlay/app/electron/main.cjs$'
          pkgroot="$(mktemp -d)"
          bsdtar -xf "$pkg" -C "$pkgroot" \
            opt/archverse-overlay/app/electron/main.cjs \
            opt/archverse-overlay/app/electron/capture.cjs \
            opt/archverse-overlay/app/server/server.mjs
          grep -q 'ARCHVERSE_LINUX_HOVER_SCOPED_LATCH' "$pkgroot/opt/archverse-overlay/app/electron/main.cjs"
          grep -q 'ARCHVERSE_LINUX_MINING_SIGNATURE_AUTHORITY' "$pkgroot/opt/archverse-overlay/app/electron/capture.cjs"
          grep -q 'ARCHVERSE_LINUX_WATCHER_HANDOFF' "$pkgroot/opt/archverse-overlay/app/server/server.mjs"
          sha256sum "$pkg"

      - uses: actions/upload-artifact@v4
        with:
          name: ArchVerse-Alpha21-Arch
          path: dist-arch/*.pkg.tar.*
          if-no-files-found: error
          retention-days: 30

  debian:
    name: Debian / Ubuntu package
    needs: payload
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ArchVerse-Alpha21-native-payload
          path: dist-payload

      - name: Prepare verified Electron 42 runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/electron42"
          curl --fail --location --retry 4 \
            "https://github.com/electron/electron/releases/download/v${ELECTRON_VERSION}/${ELECTRON_ASSET}" \
            --output "$RUNNER_TEMP/${ELECTRON_ASSET}"
          echo "$ELECTRON_SHA256  $RUNNER_TEMP/$ELECTRON_ASSET" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/$ELECTRON_ASSET" -d "$RUNNER_TEMP/electron42"
          test -x "$RUNNER_TEMP/electron42/electron"

      - name: Build and inspect DEB
        shell: bash
        run: |
          set -euo pipefail
          chmod +x packaging/debian/build-deb.sh packaging/common/archverse-overlay
          mkdir -p dist-debian
          packaging/debian/build-deb.sh \
            dist-payload/ArchVerse-Overlay-0.1.42-r31-alpha.21-payload.tar.gz \
            "$RUNNER_TEMP/electron42" \
            dist-debian
          deb="$(find dist-debian -type f -name '*.deb' -print -quit)"
          test -n "$deb"
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb" | grep -E 'usr/bin/archverse-overlay|opt/archverse-overlay/runtime/electron/electron|opt/archverse-overlay/app/electron/main.cjs'
          tmpdeb="$(mktemp -d)"
          dpkg-deb -x "$deb" "$tmpdeb"
          grep -q 'ARCHVERSE_LINUX_HOVER_SCOPED_LATCH' "$tmpdeb/opt/archverse-overlay/app/electron/main.cjs"
          grep -q 'ARCHVERSE_LINUX_MINING_SIGNATURE_AUTHORITY' "$tmpdeb/opt/archverse-overlay/app/electron/capture.cjs"
          grep -q 'ARCHVERSE_LINUX_WATCHER_HANDOFF' "$tmpdeb/opt/archverse-overlay/app/server/server.mjs"
          test ! -e "$tmpdeb/opt/archverse-overlay/app/node_modules/onnxruntime-node/bin/napi-v6/linux/x64/libonnxruntime_providers_cuda.so"
          test ! -e "$tmpdeb/opt/archverse-overlay/app/node_modules/onnxruntime-node/bin/napi-v6/linux/x64/libonnxruntime_providers_tensorrt.so"
          sha256sum "$deb"

      - uses: actions/upload-artifact@v4
        with:
          name: ArchVerse-Alpha21-Debian
          path: dist-debian/*.deb
          if-no-files-found: error
          retention-days: 30

  fedora:
    name: Fedora 43 / Nobara package
    needs: payload
    runs-on: ubuntu-latest
    container: fedora:43
    timeout-minutes: 45
    steps:
      - name: Prepare Fedora build container
        shell: bash
        run: |
          set -euo pipefail
          dnf -y install git rpm-build tar gzip findutils curl unzip cpio

      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ArchVerse-Alpha21-native-payload
          path: dist-payload

      - name: Prepare verified Electron 42 runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/electron42"
          curl --fail --location --retry 4 \
            "https://github.com/electron/electron/releases/download/v${ELECTRON_VERSION}/${ELECTRON_ASSET}" \
            --output "$RUNNER_TEMP/$ELECTRON_ASSET"
          echo "$ELECTRON_SHA256  $RUNNER_TEMP/$ELECTRON_ASSET" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/$ELECTRON_ASSET" -d "$RUNNER_TEMP/electron42"
          test -x "$RUNNER_TEMP/electron42/electron"
          mkdir -p "$RUNNER_TEMP/electron-stage/electron-runtime"
          cp -a "$RUNNER_TEMP/electron42/." "$RUNNER_TEMP/electron-stage/electron-runtime/"
          tar -C "$RUNNER_TEMP/electron-stage" -czf "$RUNNER_TEMP/electron-runtime.tar.gz" electron-runtime

      - name: Build, inspect and dependency-check RPM
        shell: bash
        run: |
          set -euo pipefail
          TOP="$RUNNER_TEMP/rpmbuild"
          mkdir -p "$TOP"/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          cp dist-payload/ArchVerse-Overlay-0.1.42-r31-alpha.21-payload.tar.gz "$TOP/SOURCES/"
          cp "$RUNNER_TEMP/electron-runtime.tar.gz" "$TOP/SOURCES/"
          cp packaging/common/archverse-overlay "$TOP/SOURCES/"
          cp packaging/common/archverse-overlay.desktop "$TOP/SOURCES/"
          cp packaging/fedora/archverse-overlay.spec "$TOP/SPECS/"
          rpmbuild --define "_topdir $TOP" -bb "$TOP/SPECS/archverse-overlay.spec"
          mkdir -p "$GITHUB_WORKSPACE/dist-fedora"
          find "$TOP/RPMS" -type f -name '*.rpm' -exec cp -v {} "$GITHUB_WORKSPACE/dist-fedora/" \;
          rpmfile="$(find "$GITHUB_WORKSPACE/dist-fedora" -type f -name '*.rpm' -print -quit)"
          test -n "$rpmfile"
          rpm -qip "$rpmfile"
          rpm -qlp "$rpmfile" | grep -E '/usr/bin/archverse-overlay$|/opt/archverse-overlay/runtime/electron/electron$|/opt/archverse-overlay/app/electron/main.cjs$'
          rpm -qpR "$rpmfile" | sort | tee "$RUNNER_TEMP/rpm-requires.txt"
          if grep -Eiq 'libcuda|libcudart|libcublas|libcudnn|libcufft|libcurand|libnvinfer|libnvonnxparser|tensorrt|libc\.musl' "$RUNNER_TEMP/rpm-requires.txt"; then
            echo 'ERROR: optional CUDA/TensorRT/musl dependency leaked into Fedora/Nobara RPM' >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/rpm-unpack"
          (cd "$RUNNER_TEMP/rpm-unpack" && rpm2cpio "$rpmfile" | cpio -idm --quiet)
          grep -q 'ARCHVERSE_LINUX_HOVER_SCOPED_LATCH' "$RUNNER_TEMP/rpm-unpack/opt/archverse-overlay/app/electron/main.cjs"
          grep -q 'ARCHVERSE_LINUX_MINING_SIGNATURE_AUTHORITY' "$RUNNER_TEMP/rpm-unpack/opt/archverse-overlay/app/electron/capture.cjs"
          grep -q 'ARCHVERSE_LINUX_WATCHER_HANDOFF' "$RUNNER_TEMP/rpm-unpack/opt/archverse-overlay/app/server/server.mjs"
          sha256sum "$rpmfile"

      - uses: actions/upload-artifact@v4
        with:
          name: ArchVerse-Alpha21-Fedora-Nobara
          path: dist-fedora/*.rpm
          if-no-files-found: error
          retention-days: 30

  package-set:
    name: Publish CI package set
    needs: [arch, debian, fedora]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ArchVerse-Alpha21-*
          path: native-packages
          merge-multiple: true

      - name: Generate package checksums
        shell: bash
        run: |
          set -euo pipefail
          cd native-packages
          sha256sum *.pkg.tar.* *.deb *.rpm | tee SHA256SUMS
          sha256sum -c SHA256SUMS
          ls -lh

      - uses: actions/upload-artifact@v4
        with:
          name: ArchVerse-Alpha21-Native-Three-Distro
          path: |
            native-packages/*.pkg.tar.*
            native-packages/*.deb
            native-packages/*.rpm
            native-packages/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
